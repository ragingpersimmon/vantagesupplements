# Render Blueprint for the Vantage Spree API (Dashboard → Blueprints → New → this repo).
# The storefront deploys separately on Vercel (project root: storefront/).
#
# After the first deploy:
#   1. Shell into vantage-api: `bin/rails db:seed` (creates the store + first admin
#      from ADMIN_EMAIL / ADMIN_PASSWORD).
#   2. Mint API keys in the same shell, e.g.
#        NAME=storefront KEY_TYPE=publishable bin/rails spree:cli:create_api_key
#      (full list in README), and set them in Vercel.
#   3. Run the seeds from your machine with SPREE_API_URL=https://<api host>.

envVarGroups:
  - name: vantage-api-shared
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_FORCE_SSL
        value: "true"
      - key: RAILS_ASSUME_SSL
        value: "true"
      - key: SOLID_QUEUE_IN_PUMA
        value: "false"
      - key: SECRET_KEY_BASE
        generateValue: true
      # Generate once with `openssl rand -hex 32` each and NEVER change them:
      # rotating loses access to encrypted OAuth tokens.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public API host, e.g. api.vantagesupplements.ca (used for image URLs)
      - key: RAILS_HOST
        sync: false
      - key: SPREE_HOST
        sync: false

services:
  - type: web
    name: vantage-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon # closest Render region to Vancouver
    healthCheckPath: /up
    envVars:
      - fromGroup: vantage-api-shared
      - key: DATABASE_URL
        fromDatabase:
          name: vantage-db
          property: connectionString

  - type: worker
    name: vantage-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: bin/jobs
    plan: starter
    region: oregon
    envVars:
      - fromGroup: vantage-api-shared
      - key: DATABASE_URL
        fromDatabase:
          name: vantage-db
          property: connectionString

databases:
  - name: vantage-db
    databaseName: vantage_production
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
